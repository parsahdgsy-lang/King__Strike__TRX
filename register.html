<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ثبت نام | King Strike TRX</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>ثبت نام در King Strike TRX</h1>

<input id="email" placeholder="ایمیل">
<br><br>

<input id="password" type="password" placeholder="رمز عبور">
<br><br>

<input id="username" placeholder="نام کاربری">
<br><br>

<input id="avatar" type="file" accept="image/*">
<br><br>

<button onclick="register()">ثبت نام</button>

<p id="message"></p>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabaseUrl = "https://drglzffrzkdyspktcswq.supabase.co"
const supabaseKey = "sb_publishable_sGICuda0_-Gu3DZ3XNeVnQ_dAexvjnw"
const supabase = createClient(supabaseUrl, supabaseKey)

window.register = async function(){

let email = document.getElementById("email").value
let password = document.getElementById("password").value
let username = document.getElementById("username").value
let avatar = document.getElementById("avatar").files[0]

const { data, error } = await supabase.auth.signUp({
  email: email,
  password: password
})

let avatarUrl = "";

if (avatar) {
  const fileName = data.user.id + "_" + avatar.name;

  const { error: uploadError } = await supabase.storage
    .from("avatars")
    .upload(fileName, avatar);

  if (!uploadError) {
    avatarUrl = supabase.storage
      .from("avatars")
      .getPublicUrl(fileName).data.publicUrl;
  }
}

await supabase
  .from("profiles")
  .insert([
    {
      id: data.user.id,
      username: username,
      avatar_url: avatarUrl
    }
  ]);

document.getElementById("message").innerHTML = "✅ ثبت نام موفق بود";

setTimeout(() => {
  window.location.href = "index.html";
}, 1000);

</script>

</body>

</html>
